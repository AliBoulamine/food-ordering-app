<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Food Ordering App</title>
    <!-- Intégration de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex items-center justify-center bg-gray-50">

    <div class="flex w-full max-w-5xl bg-white shadow-lg rounded-lg overflow-hidden h-[500px]">
        
        <!-- Section Formulaire de connexion -->
        <div class="w-1/2 p-10 flex flex-col justify-center">
            <h2 class="text-3xl font-bold text-blue-600 mb-2">Login</h2>
            <h3 class="text-xl font-semibold text-gray-800 mb-6">Welcome back!</h3>
            <p class="text-gray-500 mb-6 text-sm">Enter your email address and password to access admin panel.</p>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm mb-2">Email address</label>
                    <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" value="admin@gmail.com" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 text-sm mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-3 py-2 border border-blue-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" value="........" required>
                </div>
                <div class="flex space-x-4">
                    <button type="submit" class="px-6 py-2 border border-gray-400 rounded-md text-gray-700 hover:bg-gray-100 transition">Login</button>
                    <button type="reset" class="px-6 py-2 border border-gray-400 rounded-md text-gray-700 hover:bg-gray-100 transition">Reset</button>
                </div>
            </form>
        </div>

        <!-- Section Image et Thème -->
        <div class="w-1/2 relative">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800&fit=crop" alt="Fast Food Theme" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black bg-opacity-40 flex flex-col justify-end p-8 text-white text-center">
                <h2 class="text-2xl font-bold mb-2">This beautiful theme yours!</h2>
                <p class="italic">"Best investment I made for a long time. Can only recommend it for other users."</p>
                <p class="mt-2 font-semibold">- Admin User</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
